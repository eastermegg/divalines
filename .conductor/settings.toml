"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

# divalines is currently a greenfield repo (GSAP skills + Claude config, no
# package manifest yet). These scripts auto-detect the package manager and are a
# safe no-op until a package.json exists, then activate once the app is
# scaffolded. Adjust the dev command / port flag to match your framework
# (e.g. add `--port $CONDUCTOR_PORT` to your Vite dev script).

[scripts]
# Install dependencies for a newly created workspace. Guarded so it is a safe
# no-op until package.json exists; the lockfile picks the package manager.
setup = "if [ -f package.json ]; then corepack enable >/dev/null 2>&1 || true; if [ -f pnpm-lock.yaml ]; then pnpm install; elif [ -f yarn.lock ]; then yarn install; elif [ -f package-lock.json ]; then npm ci; else npm install; fi; else echo 'No package.json yet - nothing to install.'; fi"

# Start the dev server on the workspace's assigned port so multiple workspaces
# can run at once. PORT is honored by Next.js/CRA; for Vite, add
# `--port $CONDUCTOR_PORT` to the dev script in package.json.
run = "if [ -f package.json ]; then PORT=$CONDUCTOR_PORT npm run dev; else echo 'No package.json yet - add a dev script to enable Run.'; fi"

# Reclaim disk when a workspace is archived by removing installed dependencies
# (regenerable and gitignored, so this is safe).
archive = "rm -rf node_modules"

# Each workspace gets its own CONDUCTOR_PORT, so dev servers run in parallel.
run_mode = "concurrent"
